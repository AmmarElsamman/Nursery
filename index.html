<!doctype html>
<html lang="en">
  <<<<<<< HEAD
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Name – Contact</title>
    <meta
      name="description"
      content="Find us on Instagram, Facebook, or call us."
    />
    <style>
      :root {
        --bg: #f5f6fa;
        --card: #ffffff;
        --text: #1c1e26;
        --muted: #6b7080;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14151a;
          --card: #1e2027;
          --text: #f1f2f6;
          --muted: #9aa0b3;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #ec4899);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 700;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .btn {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 16px 18px;
        margin-bottom: 14px;
        border-radius: 16px;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05rem;
        transition:
          transform 0.12s ease,
          opacity 0.12s ease;
      }
      .btn:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
      .btn svg {
        width: 26px;
        height: 26px;
        flex: none;
      }
      .btn span {
        flex: 1;
        text-align: left;
      }
      .insta {
        background: linear-gradient(45deg, #f09433, #dc2743 55%, #bc1888);
      }
      .fb {
        background: #1877f2;
      }
      .phone {
        background: #16a34a;
      }
      footer {
        margin-top: 18px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">NH</div>
      <h1>Noran Hossam</h1>
      <p class="sub">Get in touch or follow us</p>

      <!-- Replace the links below with your real ones -->
      <a
        class="btn insta"
        href="https://www.instagram.com/noran_hossam27"
        target="_blank"
        rel="noopener"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
        </svg>
        <span>Instagram</span>
      </a>

      <a
        class="btn fb"
        href="https://www.facebook.com/share/1H4r359xfu/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4.5 1.8-4.5 4.4V8H7v3.5h2.5V22H14V11.5h2.7L17 8h-3z"
          />
        </svg>
        <span>Facebook</span>
      </a>

      <a
        class="btn fb"
        href="https://www.facebook.com/share/1E467v8KsM/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4.5 1.8-4.5 4.4V8H7v3.5h2.5V22H14V11.5h2.7L17 8h-3z"
          />
        </svg>
        <span>Facebook</span>
      </a>

      <!-- Use the country code, no spaces. Example: Egypt +20 -->
      <a class="btn phone" href="https://wa.me/201101127889">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"
          />
        </svg>
        <span>Call: +20 123 456 7890</span>
      </a>

      <footer>Tap a button to open</footer>
    </main>
  </body>
</html>
